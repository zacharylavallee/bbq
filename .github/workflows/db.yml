name: DB

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  db:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # actions/checkout v7.0.1, published 2026-07-20
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0, published 2026-07-14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npx supabase start -x realtime,mailpit,postgres-meta,studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db reset
      - run: npx supabase test db
      - name: Check generated database types
        run: npx supabase gen types typescript --local | npx prettier --stdin-filepath src/types/database.ts | diff -u src/types/database.ts -
