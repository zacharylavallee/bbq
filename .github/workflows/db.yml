name: DB

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  db:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # tools/npm pins npm 12.2.0 in a lockfile (npm >= 11.10 is required for min-release-age)
      - run: npm ci --prefix tools/npm
      - run: echo "$PWD/tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx supabase start -x realtime,mailpit,postgres-meta,studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db reset
      - run: npx supabase test db
      - name: Check generated database types
        run: npx supabase gen types typescript --local | npx prettier --stdin-filepath src/types/database.ts | diff -u src/types/database.ts -
